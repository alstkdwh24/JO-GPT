<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JO-GPT 인증 처리</title>
    <style>
        /* 배경색 및 기본 스타일 */
        :root {
            --bg-color: #f0f4f9;
            --card-bg: #ffffff;
            --primary-color: #007bff;
            --text-main: #1a1a1a;
            --text-sub: #5f6368;
            --highlight: #d93025;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Pretendard', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-main);
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            text-align: center;
            max-width: 440px;
            width: 90%;
        }

        .status-icon { font-size: 48px; margin-bottom: 16px; }
        h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }

        /* 가이드 박스 */
        .guide-box {
            background-color: #f8fafd;
            border: 1px solid #e1e4e8;
            padding: 20px;
            border-radius: 16px;
            margin: 24px 0;
            font-size: 14px;
            line-height: 1.6;
            text-align: left;
        }

        .highlight { color: var(--highlight); font-weight: 700; }

        /* [추가] 체크박스 스타일 */
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            font-size: 14px;
            color: var(--text-sub);
            cursor: pointer;
        }
        .checkbox-wrapper input {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn-action {
            display: block;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 18px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-action:hover { background-color: #0069d9; }
        .btn-action:active { transform: scale(0.98); }

        .footer-text { font-size: 13px; color: var(--text-sub); margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div th:if="${token != null}">
        <div class="status-icon">🔓</div>
        <h2>로그인이 완료되었습니다</h2>

        <div class="guide-box">
            상단 팝업창에서 <span class="highlight">"항상 허용"</span>을 체크하셨나요? <br>
            체크 후 <b>[열기]</b>를 누르면 다음부터는 이 과정이 생략됩니다.
        </div>

        <label class="checkbox-wrapper">
            <input type="checkbox" id="skipGuide">
            <span>다음부터 이 안내 페이지 보지 않기</span>
        </label>

        <a id="appLink" th:href="'jo-gpt://auth-success?token=' + ${token}" class="btn-action">
            JO-GPT 앱으로 이동
        </a>
        <p class="footer-text">창이 닫히지 않으면 버튼을 눌러주세요.</p>
    </div>

    <div th:if="${error != null}">
        <div class="status-icon">⚠️</div>
        <h2>인증 오류</h2>
        <p class="guide-box" style="background-color: #fff5f5; border-color: #ffe3e3; color: #d93025;">
            사유: <span th:text="${error}">오류 메시지</span>
        </p>
        <a th:href="'jo-gpt://auth-fail?error=' + ${error}" class="btn-action" style="background-color: #5f6368;">
            앱으로 돌아가기
        </a>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const token = /*[[${token}]]*/ null;
    const error = /*[[${error}]]*/ null;
    let targetUrl = "";

    if (token) {
        targetUrl = "jo-gpt://auth-success?token=" + token;
    } else if (error) {
        targetUrl = "jo-gpt://auth-fail?error=" + encodeURIComponent(error);
    }

    // [추가] 체크박스 설정 저장 로직
    const skipCheckbox = document.getElementById('skipGuide');
    if(skipCheckbox) {
        skipCheckbox.addEventListener('change', (e) => {
            localStorage.setItem('skip_auth_guide', e.target.checked);
        });
    }

    if (targetUrl) {
        // 자동 실행 시도
        window.location.href = targetUrl;

        // 성공 시 5초 후 창 닫기 시도
        if (token) {
            setTimeout(() => { window.close(); }, 5000);
        }
    }
    /*]]>*/
</script>

</body>
</html>
